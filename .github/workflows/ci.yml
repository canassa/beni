# The tests of the gates (CLAUDE.md rule 4) on every pull request and every
# push to master, with the Zig and Node that flake.nix pins, so CI and every
# developer run the same toolchain.
#
# CI does not enforce the instruction budget (`-Dtest-budget=0`); the budget
# stays a local gate, `zig build gates` on an x86-64 Linux host. Jayson Reis
# decided this on 2026-10-14 at 17:36 UTC, and Cesar Canassa, the repository
# owner, agreed in a note at 17:34 UTC: "cancel the self-hosted solution.
# disable the CPU counter in the CI". A GitHub-hosted x86-64 runner has no
# hardware instruction counter (`perf_event_open` gives EACCES at
# `perf_event_paranoid` = 4, ENOENT at -1, also as root), and its CPU-time
# fallback failed 3, 55 and 56 tests and cases of one master commit on three
# runs; the run with 3 passed both cases that the instruction count failed.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

# A newer push to a pull request replaces its older run. Every push to
# master has a group of its own, because a group keeps only one pending run
# and would drop the run of a commit between two quick pushes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (no budget)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The installer the action runs, pinned: this release's asset, checked
      # against the SHA-256 that GitHub publishes for it. The action's own
      # pin (`source-tag` with `source-checksums-url`) needs a checksums file,
      # and the release has none. Given a binary, the action also does not
      # cache its own copy, which it did in every pull request's cache scope.
      - name: nix-installer v3.23.2
        run: |
          curl -sSfL -o "$RUNNER_TEMP/nix-installer" \
            https://github.com/DeterminateSystems/nix-installer/releases/download/v3.23.2/nix-installer-x86_64-linux
          echo "d3c174b95b948ab1744a9a3507599d030bf31a39033305e8769b51c3134daeff  $RUNNER_TEMP/nix-installer" | sha256sum --check
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          source-binary: ${{ runner.temp }}/nix-installer
          diagnostic-endpoint: ""

      # The dev shell's closure: Node 24, the stdenv, and Zig 0.17.0, which
      # comes from ziglang.org and not from a binary cache. With the store
      # restored, a run does not download Zig again. The key changes only
      # with the flake.
      - name: restore the Nix store
        id: nix-cache
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # The profile is a garbage-collector root for the shell's closure, so
      # the bound on the saved store removes only what this flake no longer
      # needs.
      - name: dev shell
        id: dev-shell
        run: nix develop --profile "$RUNNER_TEMP/dev-shell" --command true

      # Zig's local and global caches, from master's newest build.
      - name: restore the Zig caches
        id: zig-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-keys: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-

      # Zig never prunes its cache, and each master run saves the restored
      # cache plus its own additions. When a master run restores more than
      # 3 GiB, it starts from nothing, so a saved entry is at most 3 GiB plus
      # one run's additions. A pull request saves nothing and keeps what it
      # restored.
      - name: bound the Zig caches
        if: ${{ github.event_name == 'push' }}
        run: |
          du -sh .zig-cache ~/.cache/zig 2>/dev/null || true
          if [ "$(du -sc .zig-cache ~/.cache/zig 2>/dev/null | tail -1 | cut -f1)" -gt $((3 * 1024 * 1024)) ]; then
            echo "Zig caches over 3 GiB: removed"
            rm -rf .zig-cache ~/.cache/zig
          fi

      - name: zig build test test-blackbox fmt-check beni-fmt-check
        run: nix develop --command zig build test test-blackbox fmt-check beni-fmt-check -Dtest-budget=0

      # Only a push to master saves, also when a test fails, so every pull
      # request starts from master's newest build. A pull request's run
      # writes no cache entry, and its scope is its own: it cannot change
      # what master restores. The store is saved only when the dev shell
      # came up, at most 2 GiB (a cold store is 1.4 GB).
      - name: save the Nix store
        if: ${{ !cancelled() && github.event_name == 'push' && steps.dev-shell.outcome == 'success' && steps.nix-cache.outputs.hit-primary-key != 'true' }}
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          gc-max-store-size-linux: 2G

      # The key is new for each commit. It exists already only on a re-run,
      # and then there is nothing to save.
      - name: save the Zig caches
        if: ${{ !cancelled() && github.event_name == 'push' && steps.zig-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}

  # The guard: the one job that the rule on master requires, so the rule
  # stays correct when a job here is added, renamed or split into a
  # matrix. It passes only when every job in `needs:` succeeded; a failed,
  # skipped or cancelled job fails it.
  #
  # `if: always()` makes the guard report in every case. Without it, a
  # failed job skips the guard, and GitHub counts a skipped job as a
  # passed required check. `if: ${{ !cancelled() }}` has the same hole: a
  # cancelled run skips the guard.
  #
  # When a newer push to a pull request cancels the older run (the
  # concurrency group above), the older run's guard still runs, because
  # GitHub keeps a job whose `if` is true on a cancel. It reads `cancelled`
  # for `tests` and fails. That failure is on the older commit, and the
  # rule reads the head commit, where the newer run reports. A push to
  # master is never cancelled: each has a group of its own.
  #
  # `needs:` sees only the jobs of this workflow. To make a job a merge
  # condition, add it to this file and to `needs:`. To bind another
  # workflow, give it `on: workflow_call` in place of its own triggers,
  # call it from a job here with `uses: ./.github/workflows/<file>.yml`
  # and the `permissions:` and `secrets:` it needs, and add that job to
  # `needs:`.
  check:
    name: check
    if: always()
    needs: [tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Check the result of every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq --exit-status 'all(.[].result; . == "success")' > /dev/null
