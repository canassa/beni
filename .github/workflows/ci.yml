# The tests of the gates (CLAUDE.md rule 4) on every pull request and every
# push to master, with the Zig and Node that flake.nix pins, so CI and every
# developer run the same toolchain.
#
# Every job runs on azathoth (the owner, 2026-11-08): ephemeral
# self-hosted runners, label `azathoth`, NixOS, in a slice of 10 CPUs and
# 14 GiB, fenced off the host's services (infra repository,
# hosts/azathoth/github-runners.nix). The host's Nix daemon serves `nix
# develop`, and the host keeps the dev shells' closures in its store, so no
# job installs Nix or caches a store. Each job starts in an empty work
# directory and takes master's Zig and run-hash caches from the host
# (.github/ci-cache.sh): every job reads them, and only a master run of
# this workflow, proven by GitHub's OIDC token, writes them. Fork pull
# requests run only after the owner approves them.
#
name: ci

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      browser_corpus:
        description: Chrome corpus to run
        type: choice
        options: [full, managed]
        default: full
      lean:
        description: Check the Lean ownership proofs
        type: boolean
        default: false

permissions: {}

# A newer push to a pull request replaces its older run, and a newer push
# to master replaces the older master run (the owner, 2026-11-09): the 3
# azathoth runners spent most of their time on runs of commits that were
# already behind. A commit between two quick pushes to master gets no run
# of its own; the newer run checks it. Nightly and manual runs each have a
# group of their own.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref == 'refs/heads/master') && 'ci-master' || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: [self-hosted, azathoth]
    permissions:
      contents: read
      # The OIDC token that proves a master run to the cache store.
      id-token: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The profile is a garbage-collector root for the shell's closure
      # while the job runs, so the host's weekly collection cannot remove it
      # under a running job.
      - name: dev shell
        id: dev-shell
        run: nix develop --profile "$RUNNER_TEMP/dev-shell" --command true

      # The dev shell puts Zig's global cache in `~/.cache/zig-beni` unless
      # ZIG_GLOBAL_CACHE_DIR is set already (flake.nix, `zigGlobalCache`).
      # A runner has one Zig, so nothing evicts its build runner. Here the
      # global cache stays `~/.cache/zig`: the path that the cache steps
      # restore and save, so the entries that master saved still restore.
      # If the shell stops keeping the value, this step fails. Without it
      # the job saves a directory that Zig does not use.
      - name: Zig's global cache
        run: |
          echo "ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig" >> "$GITHUB_ENV"
          ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig nix develop --command zig env | grep -F ".global_cache_dir = \"$HOME/.cache/zig\""

      # The run-hash cache (tests/blackbox/run_hash.zig): one empty file
      # per emitted program that ran under Node and matched its golden,
      # named by the digest of everything the verdict depended on. The
      # gates skip Node for a program whose digest is there. The dev shell
      # puts it in `~/.cache/beni-run-hashes` unless BENI_RUN_HASH_DIR is
      # set already (flake.nix, `runHashCache`); pinned here, as the Zig
      # cache is, to the path the cache steps restore and save. If the
      # shell stops keeping the value, this step fails.
      - name: the run-hash cache's directory
        run: |
          echo "BENI_RUN_HASH_DIR=$HOME/.cache/beni-run-hashes" >> "$GITHUB_ENV"
          BENI_RUN_HASH_DIR=$HOME/.cache/beni-run-hashes nix develop --command sh -c 'test "$BENI_RUN_HASH_DIR" = "$HOME/.cache/beni-run-hashes"'

      # Zig's local and global caches, from master's newest build.
      - name: restore the Zig caches
        id: zig-cache
        run: .github/ci-cache.sh restore "zig-azathoth-${{ hashFiles('flake.lock') }}"

      # Zig never prunes its cache, and each master run saves the restored
      # cache plus its own additions. When a master run restores more than
      # 3 GiB, it starts from nothing, so a saved entry is at most 3 GiB plus
      # one run's additions. A pull request saves nothing and keeps what it
      # restored.
      - name: bound the Zig caches
        if: ${{ github.event_name == 'push' }}
        run: |
          du -sh .zig-cache ~/.cache/zig 2>/dev/null || true
          if [ "$(du -sc .zig-cache ~/.cache/zig 2>/dev/null | tail -1 | cut -f1)" -gt $((3 * 1024 * 1024)) ]; then
            echo "Zig caches over 3 GiB: removed"
            rm -rf .zig-cache ~/.cache/zig
          fi

      # The run-hash cache, from master's newest run. Restoring takes
      # master's entries into a pull request, never the other way: a pull
      # request saves nothing, so CI's verdict on master depends on no pull
      # request's cache and on no developer's. The name hashes the harness
      # that decides "passed" (the owner, 2026-10-28): a digest does not
      # cover it, so a run with a changed harness restores no entry an
      # older one wrote.
      - name: restore the run-hash cache
        id: run-hash-cache
        run: .github/ci-cache.sh restore "run-hashes-azathoth-${{ hashFiles('tests/blackbox/**', 'tests/browser/**', 'tests/serve/**', 'tests/workers/**', 'tests/test_runner.zig', 'build.zig') }}"

      # A digest is never removed, and each master run saves the restored
      # cache plus its own additions. When a master run restores more than
      # 50 000 digests (the gates verify about 2 600), it starts from
      # nothing and runs every program once. A pull request keeps what it
      # restored.
      - name: bound the run-hash cache
        if: ${{ github.event_name == 'push' }}
        run: |
          count=$(find ~/.cache/beni-run-hashes -type f 2>/dev/null | wc -l)
          echo "$count verified digests restored"
          if [ "$count" -gt 50000 ]; then
            echo "run-hash cache over 50 000 digests: removed"
            rm -rf ~/.cache/beni-run-hashes
          fi

      - name: zig build gates
        run: nix develop --command zig build gates

      # Only a push to master saves, also when a test fails, so every pull
      # request starts from master's newest build. A pull request's run
      # writes no cache entry: it cannot change what master restores. A save
      # replaces the entry of the same name.
      - name: save the Zig caches
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: .github/ci-cache.sh save "zig-azathoth-${{ hashFiles('flake.lock') }}" .zig-cache ~/.cache/zig

      # The run-hash cache is saved by a push to master, also when a test
      # fails: a failed program writes no digest, and the programs that
      # passed are verified.
      - name: save the run-hash cache
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: .github/ci-cache.sh save "run-hashes-azathoth-${{ hashFiles('tests/blackbox/**', 'tests/browser/**', 'tests/serve/**', 'tests/workers/**', 'tests/test_runner.zig', 'build.zig') }}" ~/.cache/beni-run-hashes

  # The playground's shipped compiler against the native one, byte for
  # byte, on the corpus (docs/design/playground.md §6): `zig build
  # test-playground`. It compiles the LLVM ReleaseSmall `.wasm` and the native
  # ReleaseSafe compiler, and `check` needs it, so a difference blocks a
  # merge. Its Zig caches are its own (`zig-playground-`), first filled from
  # the `tests` job's, so the two jobs never save one key.
  playground:
    name: playground (wasm against native)
    runs-on: [self-hosted, azathoth]
    permissions:
      contents: read
      # The OIDC token that proves a master run to the cache store.
      id-token: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: dev shell
        run: nix develop --command true

      # As in `tests`: the global cache stays `~/.cache/zig`.
      - name: Zig's global cache
        run: |
          echo "ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig" >> "$GITHUB_ENV"
          ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig nix develop --command zig env | grep -F ".global_cache_dir = \"$HOME/.cache/zig\""

      - name: restore the Zig caches
        id: zig-cache
        run: .github/ci-cache.sh restore "zig-playground-azathoth-${{ hashFiles('flake.lock') }}" "zig-azathoth-${{ hashFiles('flake.lock') }}"

      # As in `tests`: a master run that restores more than 3 GiB starts
      # from nothing.
      - name: bound the Zig caches
        if: ${{ github.event_name == 'push' }}
        run: |
          du -sh .zig-cache ~/.cache/zig 2>/dev/null || true
          if [ "$(du -sc .zig-cache ~/.cache/zig 2>/dev/null | tail -1 | cut -f1)" -gt $((3 * 1024 * 1024)) ]; then
            echo "Zig caches over 3 GiB: removed"
            rm -rf .zig-cache ~/.cache/zig
          fi

      - name: zig build test-playground
        run: nix develop --command zig build test-playground

      - name: save the Zig caches
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: .github/ci-cache.sh save "zig-playground-azathoth-${{ hashFiles('flake.lock') }}" .zig-cache ~/.cache/zig

  # The Lean ownership proofs (proofs/ownership/README.md):
  # `scripts/audit.sh`, the independent audit, then `lake build`, the
  # kernel check and the in-build axiom audit. `check` needs this job, so
  # on a manual run with `lean`, a proof that breaks, or a new `sorry` or
  # `axiom`, fails the run.
  #
  # The job runs the audit files of the pull request itself: Axioms.lean,
  # Audit.lean, scripts/audit.sh, the lakefile, flake.nix and this
  # workflow. So a pull request that weakens them passes its own weaker
  # audit, and this job does not catch it. #263 adds .github/CODEOWNERS,
  # which names the owner for these files. When the ruleset on master
  # requires a review from code owners, a change to them needs the
  # owner's review.
  # `nix develop` also evaluates the flake of the pull request, and runs
  # its shellHook, before any audit.
  #
  # The order of the steps matters. `scripts/audit.sh` runs first: it
  # exports the commit into a new directory, and Lean's parser rejects
  # `#eval` and the other banned commands before any audited code runs.
  # Then it builds the export from nothing. `lake build` runs after it, in
  # the checkout, on the build the audit hands over. An `#eval` in an
  # audited module runs during a build, before Axioms.lean, and can
  # rewrite files. When `lake build` ran
  # first, such a commit passed both steps with a `sorry` (#261). The step
  # after the build fails when the build changed or added a file that git
  # does not ignore.
  #
  # The proofs are checked only on demand (the owner, 2026-11-09): a manual
  # run of this workflow with the input `lean` set to true. On a push, a
  # pull request or the nightly run, the steps are skipped. The job always
  # runs, because `check` fails when a job is skipped; its first step
  # decides if the other steps run.
  #
  # Lean, 2.7 GB, comes from cache.nixos.org into azathoth's Nix store,
  # where it stays between runs.
  lean:
    name: lean (ownership proofs)
    runs-on: [self-hosted, azathoth]
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: were the proofs asked for
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          LEAN: ${{ inputs.lean }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] && [ "$LEAN" = true ]; then
            echo "a manual run with lean: check the proofs"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "the proofs run only on a manual run with lean: the next steps are skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.changes.outputs.run == 'true' }}
        with:
          persist-credentials: false

      - name: dev shell
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: nix develop .#ownership --command lean --version

      # The audit builds a clean export of the commit from nothing and
      # never reads a `.lake` it did not build. After every one of its
      # checks passed, it moves that build to the checkout's `.lake`
      # (scripts/audit.sh, step 7). The checkout is the same commit, so
      # `lake build` below finds every module up to date and replays the
      # logs of the audit's build, the source scan of Axioms.lean included,
      # instead of building the proofs a second time. A module whose
      # source in the checkout differs from the export is built again
      # there. Before, `lake build` started from master's cached `.lake`,
      # and on a pull request that changed a base module it built nearly
      # everything again: 480 s of a 20 min run (#738).
      - name: scripts/audit.sh
        if: ${{ steps.changes.outputs.run == 'true' }}
        working-directory: proofs/ownership
        run: nix develop ../..#ownership --command scripts/audit.sh HEAD .lake

      - name: lake build
        id: lake-build
        if: ${{ steps.changes.outputs.run == 'true' }}
        working-directory: proofs/ownership
        run: nix develop ../..#ownership --command lake build

      # Lean code of the pull request runs during a build and can write
      # files. A build that changed or added a file that git does not
      # ignore fails the job. When `lake build` fails, this step is
      # skipped, and the job is red already.
      - name: the build changed no file
        id: tree
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: |
          changes=$(git status --porcelain --untracked-files=all)
          if [ -n "$changes" ]; then
            echo "the build changed these files:"
            echo "$changes"
            git diff
            exit 1
          fi

  # A job-local path filter: unrelated PRs keep the existing checks and
  # avoid installing Chromium. Pushes/nightlies run the whole corpus and
  # the site check. Two outputs, one per step of `browser`: `run` says
  # whether the Chrome corpus runs, `pages` whether the site check
  # (`zig build test-pages`, issue #244) runs. The job runs when one of
  # them is true, and each step has its own `if:`, so a pull request that
  # changes only the examples runs only the site check (the owner,
  # 2026-11-05).
  browser-plan:
    name: choose Chrome corpus
    runs-on: [self-hosted, azathoth]
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      corpus: ${{ steps.plan.outputs.corpus }}
      pages: ${{ steps.plan.outputs.pages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: choose the corpus and check changed paths
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          CORPUS: ${{ inputs.browser_corpus }}
        run: |
          corpus=full
          if [ "$EVENT" = pull_request ] || [ "$CORPUS" = managed ]; then
            corpus=managed
          fi
          echo "corpus=$corpus" >> "$GITHUB_OUTPUT"
          run=true
          pages=true
          if [ "$corpus" = managed ] && [ ! -d tests/corpus/browser/managed ]; then
            echo "::notice::Managed Chrome fixtures are not on this ref yet; skip the Chrome corpus until browser/managed lands."
            run=false
          fi
          if [ "$EVENT" = pull_request ]; then
            git rev-parse --verify --quiet HEAD^2 > /dev/null || { echo "HEAD is not a merge commit"; exit 1; }
            # Task's explicit imports and their dependencies, including
            # the prelude. Keep this list with Task's imports.
            runtime=(platforms/browser src/js
              core/{Task,Duration,Schedule,Js,List,Basics,Maybe,Result,String,Char,Int,Float,Debug}.{beni,js})
            changed=$(git diff --name-only HEAD^1 HEAD -- "${runtime[@]}")
            if [ -z "$changed" ]; then
              echo "::notice::No browser runtime, Task dependency or JavaScript backend changed; skip the Chrome corpus."
              run=false
            fi
            # The site check also reads the examples and their site build,
            # the platform that Conduit is written for, and the check itself.
            site=$(git diff --name-only HEAD^1 HEAD -- "${runtime[@]}" examples platforms/browser-tea tests/browser/pages.mjs)
            if [ -z "$site" ]; then
              echo "::notice::No example, browser runtime or site check changed; skip the site check."
              pages=false
            fi
            echo "$site"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "pages=$pages" >> "$GITHUB_OUTPUT"

  # A fixed name: on a skipped job, GitHub shows a name's `${{ }}` as it
  # is written. The step `build and test Chrome fixtures` shows the corpus
  # in its environment, `CORPUS`.
  browser:
    name: Chrome
    needs: browser-plan
    if: ${{ needs.browser-plan.outputs.run == 'true' || needs.browser-plan.outputs.pages == 'true' }}
    runs-on: [self-hosted, azathoth]
    permissions:
      contents: read
      # The OIDC token that proves a master run to the cache store.
      id-token: write
    timeout-minutes: 60
    # `deploy-pages` deploys only a site whose check passed.
    outputs:
      site: ${{ steps.site.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: short Chrome socket directory
        run: |
          mkdir -p "$RUNNER_TEMP/b"
          echo "TMPDIR=$RUNNER_TEMP/b" >> "$GITHUB_ENV"
      # Chromium keeps its user-namespace sandbox: NixOS allows user
      # namespaces, and the runner's unit lets a job create them, so nothing
      # is switched on here.
      - name: browser dev shell
        id: dev-shell
        run: nix develop .#browser --profile "$RUNNER_TEMP/browser-shell" --command true
      - name: Zig's global cache
        run: |
          echo "ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig" >> "$GITHUB_ENV"
          ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig nix develop .#browser --command zig env | grep -F ".global_cache_dir = \"$HOME/.cache/zig\""
      - name: restore the Zig caches
        id: zig-cache
        run: .github/ci-cache.sh restore "zig-browser-azathoth-${{ hashFiles('flake.lock') }}" "zig-azathoth-${{ hashFiles('flake.lock') }}"
      - name: bound the Zig caches
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
        run: |
          du -sh .zig-cache ~/.cache/zig 2>/dev/null || true
          if [ "$(du -sc .zig-cache ~/.cache/zig 2>/dev/null | tail -1 | cut -f1)" -gt $((3 * 1024 * 1024)) ]; then
            echo "Zig caches over 3 GiB: removed"
            rm -rf .zig-cache ~/.cache/zig
          fi
      - name: build and test Chrome fixtures
        if: ${{ needs.browser-plan.outputs.run == 'true' }}
        env:
          CORPUS: ${{ needs.browser-plan.outputs.corpus }}
        run: |
          args=()
          if [ "$CORPUS" = managed ]; then
            args=(-Dcorpus=browser/managed)
          fi
          nix develop .#browser --command zig build test-browser "${args[@]}" --summary all
      # The examples' site as GitHub Pages serves it (issue #244): built
      # with the beni of the step above, served on 127.0.0.1 with Pages'
      # 404 rule, and loaded in Chrome with no host but 127.0.0.1. 404.html
      # must stand in for each routed program's shell at a deep path. It
      # also runs when the corpus failed, so one run reports both.
      - name: load the site's pages and deep paths
        id: site
        if: ${{ !cancelled() && steps.dev-shell.outcome == 'success' && needs.browser-plan.outputs.pages == 'true' }}
        run: nix develop .#browser --command zig build test-pages --summary all
      - name: save the Zig caches
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule') }}
        run: .github/ci-cache.sh save "zig-browser-azathoth-${{ hashFiles('flake.lock') }}" .zig-cache ~/.cache/zig

  # The `workers/` corpus (docs/design/boundary.md §9.12 (k)): Workers
  # built for the `cloudflare` platform, run under Miniflare's `workerd` by
  # tests/workers/driver.mjs, on 127.0.0.1, with nothing deployed and no
  # account used: `zig build test-workers`. Its shell, `.#workers`, adds
  # nixpkgs' wrangler to the default shell (a closure of 3.05 GB, against
  # 1.0 GB), which stays in azathoth's Nix store. It runs on every pull request,
  # because a change to `core/`, the emitter or the platform can break a
  # Worker, and `check` needs it. It uses no run-hash cache: an empty
  # BENI_RUN_HASH_DIR, which the shell keeps, so every program runs every
  # time, 34 s for the corpus locally. It builds the beni the `tests` job
  # builds, so it restores that job's Zig caches and saves none.
  workers:
    name: workers
    runs-on: [self-hosted, azathoth]
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: workers dev shell
        id: dev-shell
        run: nix develop .#workers --profile "$RUNNER_TEMP/workers-shell" --command true
      - name: Zig's global cache
        run: |
          echo "ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig" >> "$GITHUB_ENV"
          ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig nix develop .#workers --command zig env | grep -F ".global_cache_dir = \"$HOME/.cache/zig\""
      # Empty: no run-hash cache (build.zig, `runHashDir`). If the shell
      # stops keeping the value, this step fails.
      - name: no run-hash cache
        run: |
          echo "BENI_RUN_HASH_DIR=" >> "$GITHUB_ENV"
          BENI_RUN_HASH_DIR='' nix develop .#workers --command sh -c 'test -z "$BENI_RUN_HASH_DIR" && test -n "$BENI_MINIFLARE"'
      # The tests job's Zig caches, from master's newest build. This job
      # saves none, so it cannot grow them.
      - name: restore the Zig caches
        run: .github/ci-cache.sh restore "zig-azathoth-${{ hashFiles('flake.lock') }}"
      - name: zig build test-workers
        run: nix develop .#workers --command zig build test-workers --summary all

  # The examples' site (pages.yml), on every run. ci.yml calls it, and it
  # is not a workflow of its own, so that the deploy below can need the
  # `browser` job: a job cannot need a job of another workflow.
  pages:
    name: pages
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read

  # The Pages deploy, on a push to master only: the site that `pages`
  # built, after the whole `browser` job passed. Thus a site whose 404
  # stand-in fails in Chrome is never deployed (the owner, 2026-11-05),
  # and a failed Chrome corpus also stops the deploy. Each push to master
  # has a run of its own, and the Chrome jobs of two quick pushes can end
  # in either order. Thus a run whose commit is no longer master's head
  # deploys nothing, and the run of the head deploys: an older site never
  # replaces a newer one. When the run of the head fails, the site stays
  # on an older commit until a newer push passes, or a re-run of the
  # head's failed jobs. This job has no environment, so a run that does
  # not deploy writes no deployment.
  pages-head:
    name: compare with master's head
    needs: [pages, browser]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.browser.outputs.site == 'success' }}
    runs-on: [self-hosted, azathoth]
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: compare this commit with master's head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/git/ref/heads/master" --jq .object.sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::master is at $head, not at $GITHUB_SHA: the run of $head deploys."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  # Deploys run one at a time, and a newer one replaces a waiting one.
  deploy-pages:
    name: deploy to GitHub Pages
    needs: pages-head
    if: ${{ needs.pages-head.outputs.current == 'true' }}
    runs-on: [self-hosted, azathoth]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The guard: the one check the rule on master requires, so the rule
  # stays correct when a job here is added, renamed or split. It passes
  # only when every job in `needs:` succeeded, except that Chrome may be
  # skipped by its path or missing-corpus filter. No other job in any
  # workflow may be named `check`. `pages-head` and `deploy-pages` are not
  # in `needs:`: they run only on a push to master, after the merge.
  #
  # `if: always()`: a skipped job counts as a passed required check, and
  # without it a failed or cancelled `tests` skips the guard. When a newer
  # push cancels this run, the guard still runs and fails, on the older
  # commit; the rule reads the head commit. A `tests` that reaches its
  # timeout also reads `cancelled`.
  #
  # `needs:` sees only this workflow. Another workflow joins as
  # `on: workflow_call`, called here with `uses:` and added to `needs:`;
  # one that answers another event, such as `claude.yml`, cannot. A pull
  # request that this workflow skips (a `paths:` or `branches:` filter, a
  # `[skip ci]` commit) never gets `check` and waits forever.
  check:
    name: check
    if: always()
    needs: [tests, playground, lean, browser-plan, browser, workers, pages]
    runs-on: [self-hosted, azathoth]
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Check the result of every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq --exit-status 'all(to_entries[]; .value.result == "success" or (.key == "browser" and .value.result == "skipped"))' > /dev/null
