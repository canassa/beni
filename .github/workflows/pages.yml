# Builds the example programs into the site of GitHub Pages. ci.yml calls
# this workflow on every pull request and every push, and deploys the site
# from master in its job `deploy-pages`, after its `browser` job loads the
# site in Chrome with Pages' 404 rule (`zig build test-pages`, issue #244).
# The deploy is in ci.yml because a job cannot need a job of another
# workflow. The build has no paths filter: it reads the compiler, core/,
# the platforms, the flake, build.zig and build.zig.zon, the playground and
# the examples, and a list of those paths would miss the next input that is
# added.
#
# Pages takes its site from GitHub Actions (Settings, Pages, Source), so the
# site is this workflow's artifact, served as it is: no branch, and no
# Jekyll to drop the paths that start with "_" (backend.md §2). The site is
# https://<owner>.github.io/<repository>/: the index at its root and each
# program under /<name>/, built with the base /<repository>/<name>/
# (examples/build-pages.mjs).
name: pages

on:
  workflow_call:

permissions: {}

jobs:
  build:
    name: build the examples
    runs-on: [self-hosted, azathoth]
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: dev shell
        run: nix develop --command true
      # As in ci.yml: the global cache stays `~/.cache/zig`, the path that
      # ci.yml's cache entries hold.
      - name: Zig's global cache
        run: |
          echo "ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig" >> "$GITHUB_ENV"
          ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig nix develop --command zig env | grep -F ".global_cache_dir = \"$HOME/.cache/zig\""
      # ci.yml's Zig caches, read only: this workflow saves nothing.
      - name: restore the Zig caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-azathoth-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-keys: zig-azathoth-${{ hashFiles('flake.lock') }}-

      - name: zig build
        run: nix develop --command zig build

      # The playground (issue #128) joins the site when its build step
      # exists. The step writes a static site to zig-out/playground/, which
      # the site build copies to /playground/. Until then, the index marks
      # the playground as coming.
      - name: zig build playground
        id: playground
        run: |
          steps=$(nix develop --command zig build --list-steps)
          if grep -q '^  playground ' <<<"$steps"; then
            nix develop --command zig build playground
            echo "args=--playground=zig-out/playground" >> "$GITHUB_OUTPUT"
          else
            echo "no playground step: the index marks the playground as coming"
          fi

      - name: build the site
        env:
          BASE: /${{ github.event.repository.name }}/
          PLAYGROUND: ${{ steps.playground.outputs.args }}
        run: nix develop --command node examples/build-pages.mjs zig-out/bin/beni "$RUNNER_TEMP/site" "$BASE" ${PLAYGROUND:+"$PLAYGROUND"}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
          retention-days: 7
