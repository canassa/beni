# Publishes the example programs to the gh-pages branch, under /examples/,
# on every push to master. A pull request that changes the examples or this
# workflow builds the site and does not publish it.
#
# The publish job writes only /examples/ and /.nojekyll on gh-pages; every
# other path there, /index.html too, stays as it is. /.nojekyll turns off
# Jekyll, which leaves out every path that starts with "_", and a beni build
# writes _main.mjs, _core/ and _platform/ (backend.md §2).
#
# GitHub Pages serves the branch only after a repository admin selects it:
# Settings, Pages, "Deploy from a branch", gh-pages, / (root). The site is
# then https://<owner>.github.io/<repository>/, so each program is built
# under the base /<repository>/examples/<name>/ (examples/build-pages.mjs).
name: pages

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - examples/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

# Publishes run one at a time, and a newer push replaces a waiting one. A
# newer push to a pull request cancels its older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build the examples
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same pinned installer as ci.yml.
      - name: nix-installer v3.23.2
        run: |
          curl -sSfL -o "$RUNNER_TEMP/nix-installer" \
            https://github.com/DeterminateSystems/nix-installer/releases/download/v3.23.2/nix-installer-x86_64-linux
          echo "d3c174b95b948ab1744a9a3507599d030bf31a39033305e8769b51c3134daeff  $RUNNER_TEMP/nix-installer" | sha256sum --check
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          source-binary: ${{ runner.temp }}/nix-installer
          diagnostic-endpoint: ""

      # ci.yml's caches, read only: this workflow saves nothing.
      - name: restore the Nix store
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
      - name: dev shell
        run: nix develop --command true
      - name: restore the Zig caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-keys: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-

      - name: zig build
        run: nix develop --command zig build

      - name: build the site
        env:
          BASE: /${{ github.event.repository.name }}/examples/
        run: nix develop --command node examples/build-pages.mjs zig-out/bin/beni "$RUNNER_TEMP/site/examples" "$BASE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-examples
          path: ${{ runner.temp }}/site
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to gh-pages
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-examples
          path: ${{ runner.temp }}/site

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages
          persist-credentials: false

      - name: replace /examples/
        run: |
          rsync -a --delete "$RUNNER_TEMP/site/examples/" pages/examples/
          touch pages/.nojekyll

      # The token reaches only the push, as a header; it is never written
      # to pages/.git.
      - name: commit and push
        working-directory: pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already has these files"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q \
              -m "🚀 publish the examples of ${GITHUB_SHA:0:9}" \
              -m "Built from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:gh-pages
