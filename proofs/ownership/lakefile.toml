name = "ownership"
version = "0.1.0"
defaultTargets = ["Ownership", "ownership", "AxiomCheck", "audit"]
restoreAllArtifacts = true

[[lean_lib]]
name = "Ownership"

# The axiom audit: fails the build if the set of sorry-dependent theorems changes.
[[lean_lib]]
name = "AxiomCheck"
roots = ["Axioms"]
needs = ["audit"]

[[lean_exe]]
name = "ownership"
root = "Main"

# The audit executable: parses every source with Lean's parser and checks the
# built environment; it imports only Lean and Std (scripts/audit.sh).
[[lean_exe]]
name = "audit"
root = "Audit"
supportInterpreter = true

[[lean_exe]]
name = "triage"
root = "Triage"

# Optional native evidence drivers. Keep the archived source at its original path.
[[lean_exe]]
name = "fueloutcomes"
root = "FuelOutcomes"
srcDir = "evidence/construction-fuel"

[[lean_exe]]
name = "fuelleft"
root = "FuelLeft"
srcDir = "evidence/construction-fuel"

[[lean_exe]]
name = "refactoroutcomes"
root = "RefactorOutcomes"
srcDir = "evidence/enumerator-links"
