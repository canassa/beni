    <div id="root"><script>(()=>{let d=document,r=[],k=["click","submit"],f=e=>{let t=e.target;t.closest?.("[data-beni]")&&r.push([e,t.value,t.checked,t.selectedIndex])};for(let n of k)d.addEventListener(n,f,!0);window.$beni=()=>{for(let n of k)d.removeEventListener(n,f,!0);return r};d.currentScript.remove()})()</script><div data-role=app data-beni="/"><button data-role=note>Note</button><form data-role=form><button data-role=send>Send</button></form><button data-role=hide>Hide</button><output data-role=log></output><section data-role=counter><output>3</output><button data-role=inc>+1</button><button data-role=dec>-1</button><!--1--></section></div></div>
