<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>PieceHandler</title>
    <script type="module" src="/_main.mjs"></script>
  </head>
  <body><div id="root"><script>(()=>{let d=document,r=[],k=["click"],f=e=>{let t=e.target;t.closest?.("[data-beni]")&&r.push([e,t.value,t.checked,t.selectedIndex])};for(let n of k)d.addEventListener(n,f,!0);window.$beni=()=>{for(let n of k)d.removeEventListener(n,f,!0);return r};d.currentScript.remove()})()</script><div data-role=app data-beni="/"><section data-role=counter><output>3</output><button data-role=inc>+1</button><button data-role=add>+step</button><button data-role=back>-1</button><!--0--></section></div></div></body>
</html>
