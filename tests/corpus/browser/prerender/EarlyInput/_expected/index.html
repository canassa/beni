<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>EarlyInput</title>
    <script type="module" src="/_main.mjs"></script>
  </head>
  <body>
    <div id="root"><script>(()=>{let d=document,r=[],k=["change","click","input"],f=e=>{let t=e.target;t.closest?.("[data-beni]")&&r.push([e,t.value,t.checked,t.selectedIndex])};for(let n of k)d.addEventListener(n,f,!0);window.$beni=()=>{for(let n of k)d.removeEventListener(n,f,!0);return r};d.currentScript.remove()})()</script><section data-role=app data-beni="/"><button data-role=inc><b>+</b></button><input data-role=name value="Ada"><input type=checkbox data-role=agree><select data-role=plan><option value=free selected>Free</option><option value=team>Team</option></select><output data-role=count>0</output><output data-role=log></output></section></div>
  </body>
</html>
