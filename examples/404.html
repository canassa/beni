<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Not found · beni examples</title>
    <!--
      GitHub Pages answers a path that names no file with this page. Under a
      program that routes by path, such as /conduit/article/<slug> after a
      reload, the page runs that program, which reads its route from the
      address. This page stands in for the program's page shell:
      examples/build-pages.mjs fills in each such program with the shell
      its build wrote, and the script puts that shell in place of this
      page. A script that DOMParser parses never runs, so each script of
      the shell is made again, which runs it.
    -->
    <script type="module">
      const app = {{apps}}.find(({ base }) => location.pathname.startsWith(base));
      if (app) {
        const shell = new DOMParser().parseFromString(app.shell, "text/html");
        // This script leaves the document with the old element, and it
        // still runs to its end.
        document.replaceChild(document.adoptNode(shell.documentElement), document.documentElement);
        for (const parsed of document.querySelectorAll("script")) {
          const script = document.createElement("script");
          for (const { name, value } of parsed.attributes) script.setAttribute(name, value);
          script.async = parsed.async;
          script.text = parsed.text;
          parsed.replaceWith(script);
        }
      } else {
        document.getElementById("not-found").hidden = false;
      }
    </script>
    <!--
      #not-found covers the viewport, which gives the page its background.
    -->
    <style>
      #not-found {
        --bg: #fbfaf7;
        --fg: #1d1c1a;
        --accent: #b4381f;
        position: fixed;
        inset: 0;
        overflow: auto;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #not-found { --bg: #161513; --fg: #ece9e3; --accent: #f07a5c; }
      }
      #not-found > div { max-width: 46rem; margin: 0 auto; padding: 3rem 1rem; }
      #not-found a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main id="not-found" hidden>
      <div>
        <h1>Not found</h1>
        <p>No page has this address. <a href="{{base}}">The beni examples</a> are here.</p>
      </div>
    </main>
  </body>
</html>
