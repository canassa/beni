<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>beni playground</title>
    <link rel="stylesheet" href="style.css">
    <!--
      CodeMirror 6, its modules in the site's own `vendor/`
      (docs/design/playground.md §4.2): each the ES module its npm package
      ships, unmodified, at the version `vendor.sh` pins, checked against
      `vendor/SHA256SUMS`. Each module's imports are bare, so this map is the
      one place a package resolves, and each loads once.
    -->
    <script type="importmap">
      {
        "imports": {
          "@codemirror/state": "./vendor/codemirror-state.js",
          "@codemirror/view": "./vendor/codemirror-view.js",
          "@codemirror/language": "./vendor/codemirror-language.js",
          "@codemirror/commands": "./vendor/codemirror-commands.js",
          "@codemirror/lint": "./vendor/codemirror-lint.js",
          "@codemirror/autocomplete": "./vendor/codemirror-autocomplete.js",
          "@codemirror/search": "./vendor/codemirror-search.js",
          "@lezer/common": "./vendor/lezer-common.js",
          "@lezer/highlight": "./vendor/lezer-highlight.js",
          "@marijn/find-cluster-break": "./vendor/marijn-find-cluster-break.js",
          "crelt": "./vendor/crelt.js",
          "style-mod": "./vendor/style-mod.js",
          "w3c-keyname": "./vendor/w3c-keyname.js",
          "@codemirror/legacy-modes/mode/elm": "./vendor/codemirror-legacy-modes-elm.js",
          "@codemirror/lang-javascript": "./vendor/codemirror-lang-javascript.js",
          "@lezer/javascript": "./vendor/lezer-javascript.js",
          "@lezer/lr": "./vendor/lezer-lr.js",
          "@codemirror/lang-css": "./vendor/codemirror-lang-css.js",
          "@lezer/css": "./vendor/lezer-css.js"
        }
      }
    </script>
    <script>
      // A module of the page that does not load (the site lacks a file, or
      // the network failed) fails before the page's own code runs.
      // A load error does not bubble, so this listens where it passes on
      // its way down to the script.
      addEventListener(
        "error",
        (event) => {
          if (!(event.target instanceof HTMLScriptElement)) return;
          const status = document.getElementById("status");
          status.textContent = `The page could not load ${event.target.src}.`;
          status.className = "error";
        },
        true,
      );
    </script>
    <script type="module" src="page.js"></script>
  </head>
  <body>
    <header>
      <h1>beni playground</h1>
      <label>
        Sample
        <select id="sample"></select>
      </label>
      <label>
        Platform
        <select id="platform">
          <option value="browser-direct">browser-direct (a page)</option>
          <option value="node">node (a program that prints)</option>
        </select>
      </label>
      <button id="share" type="button">Share</button>
      <span id="status" role="status">Loading the compiler…</span>
    </header>
    <p id="note">
      <code>browser-direct</code> is new. The samples here build for it today; some programs that build
      for <code>browser-tea</code> do not build for it yet.
    </p>
    <main>
      <section class="pane" aria-label="Source">
        <nav class="tabs" role="tablist" aria-label="Files">
          <button role="tab" data-file="editor" aria-selected="true">Main.beni</button>
          <button role="tab" data-file="css-editor" aria-selected="false">style.css</button>
        </nav>
        <div id="editor" class="editor" role="tabpanel" aria-label="Main.beni"></div>
        <div id="css-editor" class="editor" role="tabpanel" aria-label="style.css" hidden></div>
        <div id="diagnostics" aria-label="Diagnostics"></div>
      </section>
      <section class="pane" aria-label="Output">
        <nav class="tabs" role="tablist">
          <button role="tab" data-tab="result" aria-selected="true">Result</button>
          <button role="tab" data-tab="javascript" aria-selected="false">JavaScript</button>
          <button role="tab" data-tab="types" aria-selected="false">Types</button>
          <button role="tab" data-tab="ownership" aria-selected="false">Ownership</button>
        </nav>
        <div id="result" role="tabpanel">
          <iframe id="frame" sandbox="allow-scripts" title="The compiled program"></iframe>
          <pre id="console" aria-label="Console"></pre>
        </div>
        <div id="javascript" role="tabpanel" hidden>
          <select id="file" aria-label="Emitted file"></select>
          <div id="code"></div>
        </div>
        <div id="types" role="tabpanel" hidden>
          <pre id="types-text"></pre>
        </div>
        <div id="ownership" role="tabpanel" hidden>
          <pre id="ownership-text"></pre>
        </div>
      </section>
    </main>
  </body>
</html>
